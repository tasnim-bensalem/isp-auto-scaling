apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dashboard
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-dashboard
  template:
    metadata:
      labels:
        app: frontend-dashboard
    spec:
      containers:
      - name: frontend
        image: isp-frontend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  selector:
    app: frontend-dashboard
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
